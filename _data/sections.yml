# The stages on the arcade menu, in order. They also become the desktop icons,
# start-menu entries and Messenger "contacts" on the inside pages.
#
#   id     – used in a note's front matter:  section: cpp
#   kind   – notes | projects | album | reviews | page
#   icon   – one of: cpp, design, projects, album, reviews, devlog, about, links
#   label  – the cute lowercase name under the desktop icon

